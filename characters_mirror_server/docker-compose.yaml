services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: characters_mirror
      POSTGRES_PASSWORD: "REDACTED_ROTATED_SECRET"
    volumes:
      - characters_mirror_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "REDACTED_ROTATED_SECRET"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: characters_mirror_test
      POSTGRES_PASSWORD: "REDACTED_ROTATED_SECRET"
    volumes:
      - characters_mirror_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "REDACTED_ROTATED_SECRET"
    environment:
      - REDIS_REPLICATION_MODE=master

  minio:
    image: quay.io/minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: characters_mirror
      MINIO_ROOT_PASSWORD: REDACTED_ROTATED_SECRET
    command: server /data --console-address ":9001"
    volumes:
      - characters_mirror_storage:/data
volumes:
  characters_mirror_data:
  characters_mirror_test_data:
  characters_mirror_storage: