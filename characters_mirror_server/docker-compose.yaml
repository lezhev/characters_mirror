services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: characters_mirror
      POSTGRES_PASSWORD: "IVV7F0I08qJQJN-1XBzIWd5j73xJ7ool"
    volumes:
      - characters_mirror_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "gMX8CqJSd12vZ3FmcuLZOZV3I4Bsdz_W"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: characters_mirror_test
      POSTGRES_PASSWORD: "W0I8lIAlxkEBQ66zxkuH8PnB2tRTzRRc"
    volumes:
      - characters_mirror_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "SLdqlUKtpLJtpJ-ornx91OZ8MxxZjd_i"
    environment:
      - REDIS_REPLICATION_MODE=master

  minio:
    image: quay.io/minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: characters_mirror
      MINIO_ROOT_PASSWORD: characters_mirror_dev_password
    command: server /data --console-address ":9001"
    volumes:
      - characters_mirror_storage:/data
volumes:
  characters_mirror_data:
  characters_mirror_test_data:
  characters_mirror_storage: