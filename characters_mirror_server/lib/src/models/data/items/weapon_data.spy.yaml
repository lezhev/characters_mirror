class: WeaponData
table: weapon_data
fields:
  name: String?
  description: String?
  source: String?
  version: int?
  createdAt: DateTime?
  updatedAt: DateTime?

  isSimple: bool?              # Simple / Martial
  isMelee: bool?               # Melee / Ranged
  damage: String?              # Dice enum
  damageType: String?          # DamageType enum
  properties: List<String>?    # WeaponProperty enum
  weight: double?
  cost: double?                # "10"
  rangeNormal: int?            # 20, 30, 80 и т.д.
  rangeMax: int?               # 60, 120 и т.д.
