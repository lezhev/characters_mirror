class: WeaponData
table: weapon_data
fields:
  referenceKey: String?
  name: String?
  description: String?
  source: String?
  version: int?
  createdAt: DateTime?
  updatedAt: DateTime?

  category: WeaponCategory?
  damage: String?
  damageType: DamageType?
  properties: List<WeaponProperty>?
  weight: double?
  cost: double?
  rangeNormal: int?
  rangeMax: int?
indexes:
  weapon_reference_key_idx:
    fields: referenceKey
    unique: true
