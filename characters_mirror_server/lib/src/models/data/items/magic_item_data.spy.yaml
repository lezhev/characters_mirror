class: MagicItemData
table: magic_item_data
fields:
  referenceKey: String?
  name: String?
  description: String?
  source: String?
  version: int?
  createdAt: DateTime?
  updatedAt: DateTime?

  rarity: String?              # Common / Uncommon / Rare / Very Rare / Legendary / Artifact
  type: String?                # Weapon / Armor / Wand / Ring / Wondrous Item / etc.
  requiresAttunement: bool?
  attunementCondition: String? # например "by a wizard", если ограничено
  bonus: Map<String, int>?
  charges: int?
  rechargeCondition: String?
  effects: List<String>?
indexes:
  magic_item_reference_key_idx:
    fields: referenceKey
    unique: true
