class: ArmorData
table: armor_data
fields:
  referenceKey: String?
  name: String?
  description: String?
  source: String?
  version: int?
  createdAt: DateTime?
  updatedAt: DateTime?

  categoryValue: ArmorCategory?
  baseAC: int?
  bonusAC: int?
  dexBonus: bool?
  dexBonusMax: int?
  strengthRequirement: int?
  stealthDisadvantage: bool?
  weight: double?
  cost: String?
indexes:
  armor_reference_key_idx:
    fields: referenceKey
    unique: true
