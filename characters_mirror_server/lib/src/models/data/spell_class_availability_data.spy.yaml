# Join-модель между заклинанием и классом.
# Нужна для нормализованного хранения spell list без массива class id внутри SpellData.
class: SpellClassAvailabilityData
table: spell_class_availability_data
fields:
  spellId: int # FK на заклинание
  spell: SpellData?, relation(name=spell_class_availability, field=spellId)
  classDataId: int # FK на класс
  classData: ClassData?, relation(field=classDataId)
  source: String?
  version: int?
  createdAt: DateTime?
  updatedAt: DateTime?
indexes:
  spell_class_availability_unique_idx:
    fields: spellId, classDataId # Не допускает дубликаты одной и той же пары spell/class
    unique: true
