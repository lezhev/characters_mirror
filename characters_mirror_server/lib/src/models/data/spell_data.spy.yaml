class: SpellData
table: spell_data
fields:
  name: String?
  description: String?
  source: String?
  version: int?
  createdAt: DateTime?
  updatedAt: DateTime?

  level: int?
  schoolValue: SpellSchool?
  castingTime: String?
  range: String?
  duration: String?
  concentration: bool?
  ritual: bool?
  higherLevel: String?
  savingThrowAbility: Ability?
  requiresSavingThrow: bool?
  attackType: SpellAttackType?
  requiresAttackRoll: bool?
  damageType: DamageType?
  damageDice: String?
  damageScaling: SpellScalingData?
  conditions: List<ConditionType>?
  targetType: SpellTargetType?
  areaOfEffect: SpellAreaOfEffectData?
  materialDescription: String?
  materialCost: int?
  materialConsumed: bool?
  durationType: SpellDurationType?
  isHealing: bool?
  healingDice: String?
  requiresLineOfSight: bool?
  requiresVerbal: bool?
  requiresSomatic: bool?
  requiresMaterial: bool?
  classAvailability: List<SpellClassAvailabilityData>?, relation(name=spell_class_availability)
