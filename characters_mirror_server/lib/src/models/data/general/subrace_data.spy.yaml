  skillProficiencies: List<String>?

  speedBonus: int?
  swimSpeed: int?
  climbSpeed: int?
  flySpeed: int?
  visionType: String?

  resistances: List<String>?
  variantOptions: List<String>?

  ageDescription: String?
  alignmentDescription: String?
  physicalDescription: String?
