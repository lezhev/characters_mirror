class: ClassData
table: class_data
fields:
  referenceKey: String?
  name: String?
  description: String?
  source: String?
  version: int?
  createdAt: DateTime?
  updatedAt: DateTime?
  hitDieValue: int?
  primaryAbilities: List<Ability>?
  savingThrowProficiencies: List<Ability>?
  armorTraining: List<ArmorCategory>?
  weaponTraining: List<String>?
  toolTrainingKeys: List<String>?
  availableSkills: List<Skill>?
  skillCount: int?

  subclassChoiceLevel: int?
  spellcastingProgression: SpellcastingProgression?
  spellSelectionMode: ClassSpellSelectionMode?
  spellcastingAbilityValue: Ability?
  multiclassPrerequisites: Map<String, int>?
  multiclassArmorTraining: List<ArmorCategory>?
  multiclassWeaponTraining: List<String>?
  multiclassToolTrainingKeys: List<String>?

  imageURL: String?

indexes:
  class_reference_key_idx:
    fields: referenceKey
    unique: true
