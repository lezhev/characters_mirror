class: RaceData
table: race_data
fields:
  name: String?
  description: String?
  source: String?
  version: int?
  createdAt: DateTime?
  updatedAt: DateTime?

  speed: int?
  size: String?
  abilityBonuses: Map<String, int>?
  traits: List<String>?
  languages: List<String>?

  visionType: String?
  visionRange: int?
  resistances: List<String>?
  skillProficiencies: List<String>?
  armorProficiencies: List<String>?
  weaponProficiencies: List<String>?
  toolProficiencies: List<String>?
  spellcasting: Map<String, SpellData>?
  choiceSets: List<RaceChoiceSetData>?, relation

  imageURL: String?
