class: RaceData
table: race_data
fields:
  name: String?
  description: String?
  source: String?
  version: int?
  createdAt: DateTime?
  updatedAt: DateTime?

  speed: int?
  size: CreatureSize?
  strengthBonus: int?
  dexterityBonus: int?
  constitutionBonus: int?
  intelligenceBonus: int?
  wisdomBonus: int?
  charismaBonus: int?
  traits: List<String>?
  languages: List<String>?

  visionType: SenseType?
  visionRange: int?
  resistances: List<DamageType>?
  skillProficiencies: List<String>?
  armorProficiencies: List<String>?
  weaponProficiencies: List<String>?
  toolProficiencies: List<String>?
  features: List<RaceFeatureData>?, relation(name=race_features)

  imageURL: String?
