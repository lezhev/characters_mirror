class: RaceFeatureData
table: race_feature_data
fields:
  race: RaceData?, relation (optional)
  subrace: SubraceData?, relation (optional)
  name: String?
  description: String?
  source: String?
  version: int?
  createdAt: DateTime?
  updatedAt: DateTime?

  level: int?                       
  spells: Map<String, int>?    # spellName -> lvlGranted
  usesPerRest: String?
  usesFormula: String?
