class: RaceFeatureData
table: race_feature_data
fields:
  race: RaceData?, relation(name=race_features, optional)
  subrace: SubraceData?, relation(name=subrace_features, optional)
  name: String?
  description: String?
  shortDescription: String?
  source: String?
  version: int?
  createdAt: DateTime?
  updatedAt: DateTime?

  level: int?
  usesPerRest: RestType?
  usesFormula: String?
  tags: List<FeatureTag>?
  spellGrants: List<RaceFeatureSpellGrantData>?, relation(name=race_feature_spell_grants)
  choiceSets: List<RaceChoiceSetData>?, relation(name=race_feature_choice_sets)
