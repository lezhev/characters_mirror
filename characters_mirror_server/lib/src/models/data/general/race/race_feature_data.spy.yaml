class: RaceFeatureData
table: race_feature_data
fields:
  race: RaceData?, relation (optional)
  subrace: SubraceData?, relation (optional)
  name: String?
  description: String?
  source: String?
  version: int?
  createdAt: DateTime?
  updatedAt: DateTime?

  level: int?
  spells: Map<String, int>? # deprecated; use spellGrants
  usesPerRest: String?
  usesFormula: String?
  tags: List<FeatureTag>?
  spellGrants: List<RaceFeatureSpellGrantData>?, relation
  choiceSets: List<RaceChoiceSetData>?, relation
