class: SubraceData
table: subrace_data
fields:
  name: String?
  parentRace: RaceData?, relation
  description: String?
  source: String?
  version: int?
  createdAt: DateTime?
  updatedAt: DateTime?

  abilityBonuses: Map<String, int>?
  traits: List<String>?
  speedOverride: int?
  visionRangeOverride: int?
  skillProficiencies: List<String>?
  resistances: List<String>?
  armorProficiencies: List<String>?
  weaponProficiencies: List<String>?
  toolProficiencies: List<String>?
  choiceSets: List<RaceChoiceSetData>?, relation
