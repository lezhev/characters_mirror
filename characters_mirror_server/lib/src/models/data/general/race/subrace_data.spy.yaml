class: SubraceData
table: subrace_data
fields:
  name: String?
  parentRace: RaceData?, relation
  description: String?
  source: String?
  version: int?
  createdAt: DateTime?
  updatedAt: DateTime?

  strengthBonus: int?
  dexterityBonus: int?
  constitutionBonus: int?
  intelligenceBonus: int?
  wisdomBonus: int?
  charismaBonus: int?
  traits: List<String>?
  speedOverride: int?
  visionRangeOverride: int?
  skillProficiencies: List<String>?
  resistances: List<DamageType>?
  armorProficiencies: List<String>?
  weaponProficiencies: List<String>?
  toolProficiencies: List<String>?
  features: List<RaceFeatureData>?, relation(name=subrace_features)
