class: CharacterChoiceRecord
serverOnly: true
table: character_choice_data
fields:
  character: CharacterRecord?, relation
  classEntry: CharacterClassEntryRecord?, relation(optional)
  sourceType: ChoiceSourceType?
  sourceId: int?
  groupKey: String?
  optionKey: String?
  selectionIndex: int?
  selectedAbility: Ability?
  selectedLanguage: Language?
  selectedToolKey: String?
  selectedSpellKey: String?
  selectedFeatId: int?
  selectedText: String?
  selectedCount: int?
