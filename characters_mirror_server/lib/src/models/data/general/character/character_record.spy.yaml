class: CharacterRecord
serverOnly: true
table: characters
fields:
  name: String?
  age: String?
  height: String?
  weight: String?
  eyes: String?
  skin: String?
  hair: String?
  appearance: String?
  backstory: String?
  goals: String?
  alliesOrganizations: String?
  personalityTraits: String?
  ideals: String?
  bonds: String?
  flaws: String?
  version: int?
  createdAt: DateTime?
  updatedAt: DateTime?
  userId: int?
  experience: int?
  alignmentValue: CharacterAlignment?
  race: RaceData?, relation(optional)
  subrace: SubraceData?, relation(optional)
  background: BackgroundData?, relation(optional)
  baseAbilityScores: Map<String, int>?
  customAbilityBonuses: Map<String, int>?
  useFlexibleAbilityBonuses: bool?
  temporaryHp: int?
  currentHp: int?
  currentSpellSlots: Map<int, int>?
  activeConcentrationSpellName: String?
  activeConditions: List<ConditionType>?
  exhaustionLevel: int?
  inspiration: bool?
  equipment: List<CharacterInventoryItemData>?
  manualSkillProficiencies: List<CharacterSkillProficiencyState>?
  manualSavingThrowProficiencies: List<Ability>?
  notes: List<CharacterNoteData>?
  attacks: List<CharacterAttackData>?
  featureOverrides: List<CharacterFeatureOverrideData>?
  resourceStates: List<CharacterResourceStateData>?
