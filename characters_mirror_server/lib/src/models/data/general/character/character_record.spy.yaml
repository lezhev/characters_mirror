class: CharacterRecord
serverOnly: true
table: characters
fields:
  spellActivationUses: Map<String, int>?
  name: String?
  age: String?
  height: String?
  weight: String?
  eyes: String?
  skin: String?
  hair: String?
  appearance: String?
  backstory: String?
  goals: String?
  alliesOrganizations: String?
  personalityTraits: String?
  ideals: String?
  bonds: String?
  flaws: String?
  version: int?
  portraitVersion: int?
  syncTargetRevisions: Map<String, int>?
  syncBarrierTokens: Map<String, String>?
  createdAt: DateTime?
  updatedAt: DateTime?
  userId: int?
  experience: int?
  alignmentValue: CharacterAlignment?
  race: RaceData?, relation(optional)
  subrace: SubraceData?, relation(optional)
  background: BackgroundData?, relation(optional)
  baseAbilityScores: Map<String, int>?
  customAbilityBonuses: Map<String, int>?
  useFlexibleAbilityBonuses: bool?
  temporaryHp: int?
  currentHp: int?
  deathSaveSuccesses: int?
  deathSaveFailures: int?
  hpPerLevelBonus: int?
  hpFlatBonus: int?
  currentHitDice: Map<String, int>?
  hitDiceMaxOverrides: Map<String, int>?
  currentSpellSlots: Map<int, int>?
  currentPactSlots: Map<int, int>?
  activeConcentrationSpellName: String?
  customInitiativeBonus: int?
  customArmorClassBonus: int?
  walkingSpeed: int?
  swimmingSpeed: int?
  climbingSpeed: int?
  flyingSpeed: int?
  displayedSpeedKind: CharacterSpeedKind?
  customSpellSaveDcBonus: int?
  customSpellAttackBonus: int?
  preparedSpellKeys: List<String>?
  activeConditions: List<ConditionType>?
  exhaustionLevel: int?
  inspiration: bool?
  equipment: List<CharacterInventoryItemData>?
  equippedArmor: CharacterEquipmentSelectionData?
  equippedShield: CharacterEquipmentSelectionData?
  manualSkillProficiencies: List<CharacterSkillProficiencyState>?
  manualSavingThrowProficiencies: List<Ability>?
  manualSkillProficiencyOverrides: List<CharacterSkillProficiencyState>?
  manualSavingThrowProficiencyOverrides: List<CharacterSavingThrowProficiencyOverrideData>?
  manualLanguageOverrides: CharacterLanguageOverridesData?
  manualToolProficiencyOverrides: CharacterToolProficiencyOverridesData?
  manualWeaponProficiencyOverrides: CharacterWeaponProficiencyOverridesData?
  manualArmorTrainingOverrides: CharacterArmorTrainingOverridesData?
  notes: List<CharacterNoteData>?
  attacks: List<CharacterAttackData>?
  featureOverrides: List<CharacterFeatureOverrideData>?
  resourceStates: List<CharacterResourceStateData>?
  spellRecoveryTriggers: Map<String, SpellSlotRecoveryTriggerData>?
