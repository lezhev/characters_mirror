class: BackgroundData
table: background_data
fields:
  name: String?
  description: String?
  source: String?
  version: int?
  createdAt: DateTime?
  updatedAt: DateTime?

  skillProficiencies: List<String>? # заданный набор навыков
  suggestedSkillProficiencies: List<String>? # выбор из предложенных навыков
  skillProficiencieCount: int? # количество выбираемых навыков из списка предложенных
  toolProficiencies: List<String>?
  suggestedToolProficiencies: List<String>?
  toolProficiencieCount: int?
  languages: List<String>?
  suggestedLanguages: List<String>?
  languageCount: int?
  items: List<String>?
  coins: double?
  feature: String?
  suggestedPersonality: List<String>?
  suggestedIdeal: List<String>?
  suggestedBond: List<String>?
  suggestedFlaw: List<String>?
