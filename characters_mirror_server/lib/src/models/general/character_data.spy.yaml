class: CharacterData
table: characters
fields:
  name: String?
  source: String?
  version: int?
  createdAt: DateTime?
  updatedAt: DateTime?

  experience: int?
  attributes: Map<String, int>? #Attribute enum
  race: RaceData?, relation
  subrace: SubraceData?, relation
  classes: List<ClassData>?, relation
  subclasses: List<SubclassData>?, relation
  classFeatures: List<ClassFeatureData>?, relation
  background: BackgroundData?, relation

  alignment: String? #Alignment enum
  armorClass: int?
  speed: int? 
  coins: int?

  skillProficiencies: List<String>? #Skill enum
  skillExpertises: List<String>? #Skill enum

  maxHp: int?
  temporaryHp: int?
  currentHp: int?

  preparedSpells: SpellData?, relation
  writtenSpells: SpellData?, relation
  items: ItemData?, relation
  magicItems: MagicItemData?, relation
  armor: ArmorData?, relation
  weapons: WeaponData?, relation 
