# This is the configuration file for your production environment.
# Planned deployment: Caddy terminates HTTPS on the VPS.
# This is a target configuration, not a deployed environment.
# Database roles, DNS and runtime secrets must be provisioned separately.

# Configuration for the main API server.
apiServer:
  port: 8080
  publicHost: api.charactersmirror.com
  publicPort: 443
  publicScheme: https

# Configuration for the Insights server.
# Insights must remain private: do NOT publish port 8081 or proxy it in Caddy.
insightsServer:
  port: 8081
  publicHost: localhost
  publicPort: 8081
  publicScheme: http

# Configuration for the web server.
webServer:
  port: 8082
  publicHost: charactersmirror.com
  publicPort: 443
  publicScheme: https

# This assumes PostgreSQL in the same PRIVATE Docker Compose network.
# Provision the dedicated database/role on the VPS before deployment.
# If moving the database outside the Docker network, change host and enable TLS.
database:
  host: postgres
  port: 5432
  name: characters_mirror
  user: characters_mirror_app
  requireSsl: false
  #isUnixSocket: true # defaults to false

# Redis is disabled for the closed beta. Keep it inside the private Docker
# network if enabled later; never expose Redis directly to the internet.
redis:
  enabled: false
  host: redis
  port: 6379
  #user: # defaults to empty
  #requireSsl: true # defaults to false

maxRequestSize: 524288 # The maximum size of requests allowed in bytes

sessionLogs:
  consoleEnabled: false
# persistentEnabled: true
# consoleLogFormat: json # Defaults to "json", options are "text" or "json"

# futureCallExecutionEnabled: true # Defaults to true

#futureCall:
#  concurrencyLimit: 1 # Defaults to 1, a negative or null value removes the limit
#  scanInterval: 5000 # Unit in milliseconds, defaults to 5000
